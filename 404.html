<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | LimBuilder</title>
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="The page you requested was not found on LimBuilder.">
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .error {
      text-align: center;
      padding: 80px 20px;
    }

    .error h1 {
      margin-bottom: 12px;
    }

    .error p {
      color: var(--muted);
      margin: 0 0 28px;
    }

    .error .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      color: inherit;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-weight: 600;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .error .back:hover,
    .error .back:focus-visible {
      border-color: var(--accent);
      background: #121616;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="error">
      <h1>Page Not Found</h1>
      <p>The page you're looking for does not exist.</p>
      <a class="back" href="/">← Back to LimBuilder</a>
    </main>
  </div>
</body>
</html>
